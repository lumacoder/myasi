<!doctype html><html><head><meta charset="utf-8"><title>Ink study — local Canvas2D</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#eee9dc}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style></head>
<body><canvas id="art" width="1280" height="720" aria-label="Procedural ink bamboo"></canvas>
<script src="scene-a.js"></script><script>
const q=new URLSearchParams(location.search); let start;
function play(now){if(start===undefined)start=now;renderAt(((now-start)/1000)%6);requestAnimationFrame(play)}
if(!q.has('t'))requestAnimationFrame(play);else renderAt(Number(q.get('t')));
window.READY=true;
</script></body></html>
